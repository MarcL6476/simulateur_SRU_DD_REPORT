<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fiche commentaires — opération</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{ --paper:#F1ECDD;--card:#E8E0CB;--ink:#2B3430;--soft:#5B6259;--sage:#7C8F6B;--line:#D9CBA8;--warn:#C0532A; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  #app{padding:14px 16px 20px;max-width:640px;margin:0 auto;}
  h1{margin:0;font-size:16px;font-weight:650;}
  .annee{font-size:11px;color:var(--soft);margin:2px 0 14px;}
  .champ{margin-bottom:12px;}
  .champ label{display:block;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:4px;}
  .champ textarea{width:100%;min-height:52px;resize:vertical;font-family:inherit;font-size:13px;line-height:1.4;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);}
  .champ textarea:disabled{background:var(--card);color:var(--soft);}
  .champ .etat{font-size:10px;color:var(--sage);height:14px;margin-top:2px;opacity:0;transition:opacity .3s;}
  .champ .etat.show{opacity:1;}
  .non-mappe{font-size:12px;color:var(--soft);font-style:italic;padding:6px 0;}
  .btn-archiver{width:100%;background:var(--sage);color:#fff;border:none;border-radius:4px;padding:10px;font-size:13px;font-weight:650;cursor:pointer;margin:6px 0 18px;}
  .btn-archiver:hover{opacity:.92;}
  .btn-archiver:disabled{background:var(--line);color:var(--soft);cursor:default;}
  .section-label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:600;margin:0 0 8px;border-top:1px solid var(--line);padding-top:12px;}
  .archive-item{background:var(--card);border:1px solid var(--line);border-radius:4px;margin-bottom:6px;overflow:hidden;}
  .archive-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;cursor:pointer;font-size:12.5px;}
  .archive-head .annee-badge{font-weight:650;}
  .archive-head .date{color:var(--soft);font-size:11px;}
  .archive-body{display:none;padding:0 10px 10px;border-top:1px solid var(--line);}
  .archive-item.ouvert .archive-body{display:block;}
  .archive-body .ligne{font-size:12px;line-height:1.5;margin-top:8px;}
  .archive-body .ligne .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--soft);font-weight:600;display:block;margin-bottom:2px;}
  .vide{font-size:12px;color:var(--soft);font-style:italic;}
  .avertissement{font-size:11px;color:var(--warn);background:#F7E4D8;border:1px solid var(--warn);border-radius:4px;padding:6px 9px;margin-bottom:12px;}
  #empty{text-align:center;padding:48px 12px;color:var(--soft);font-size:13px;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="app">
  <div id="fiche" class="hidden">
    <h1 id="titre">Opération</h1>
    <div class="annee" id="sousTitre"></div>

    <div id="avertissementArchives" class="avertissement hidden"></div>

    <div id="champs"></div>

    <button class="btn-archiver" id="btnArchiver">Archiver le bilan</button>

    <div class="section-label">Bilans archivés</div>
    <div id="listeArchives"></div>
  </div>
  <div id="empty">Sélectionnez une opération.</div>
</div>

<script>
// ============================================================
// Colonnes de OP — mappées depuis le panneau Grist (noms logiques du widget)
// ============================================================
const CHAMPS = [
  { cle: "Procedure",            titre: "Procédure" },
  { cle: "Difficultes",          titre: "Difficultés rencontrées" },
  { cle: "EffetsLevier",         titre: "Effets de levier pour un déblocage opérationnel" },
  { cle: "Commentaires",         titre: "Commentaires / délibération CM / participation financière" },
  { cle: "RemarquePartenaires",  titre: "Remarque partenaires" }
];

grist.ready({
  requiredAccess: "full",
  allowSelectBy: true,
  columns: [
    { name: "Libelle", title: "Libellé (affichage)", type: "Any", optional: true },
    ...CHAMPS.map(c => ({ name: c.cle, title: c.titre, type: "Any", optional: true }))
  ]
});

// ============================================================
// Archives_Commentaires — table séparée, lue/écrite par son nom (comme Foncier_repere,
// Prospects_PB_2026 ailleurs dans ce projet). Colonnes détectées automatiquement parmi ces
// candidats : si une colonne n'est pas trouvée, ajoute son nom exact en tête de la liste.
// ============================================================
const TABLE_ARCHIVES = "Archives_Commentaires";
const CANDIDATS_ARCHIVES = {
  operation: ["Operation", "OP", "Op", "Operation_Ref", "Ref_OP"],
  annee:     ["Annee", "AnneeBilan", "Annee_Bilan"],
  date:      ["DateArchivage", "Date_Archivage", "Date"],
  Procedure:           ["Procedure"],
  Difficultes:         ["Difficultes"],
  EffetsLevier:        ["EffetsLevier", "Effets_Levier"],
  Commentaires:        ["Commentaires"],
  RemarquePartenaires: ["RemarquePartenaires", "Remarque_Partenaires"]
};

let colonnesArchives = null;   // { operation:"...", annee:"...", date:"...", Procedure:"...", ... } ou null si table/colonnes introuvables
let archivesCache = [];        // toutes les lignes de Archives_Commentaires, chargées une seule fois
let erreurArchives = "";

function trouverColonne(cles, candidats) {
  for (const c of candidats) {
    const k = cles.find(cle => cle.toLowerCase() === c.toLowerCase());
    if (k) return k;
  }
  return null;
}

// Chargement unique au démarrage (pas à chaque sélection de ligne, pour limiter les appels API).
async function chargerArchives() {
  try {
    const donnees = await grist.docApi.fetchTable(TABLE_ARCHIVES);
    const cles = Object.keys(donnees);
    const resolues = {};
    for (const [champ, candidats] of Object.entries(CANDIDATS_ARCHIVES)) {
      resolues[champ] = trouverColonne(cles, candidats);
    }
    if (!resolues.operation || !resolues.annee) {
      erreurArchives = `Colonnes "Operation" et/ou "Annee" introuvables dans ${TABLE_ARCHIVES}. Colonnes disponibles : ${cles.join(", ")}`;
      console.warn(erreurArchives);
      return;
    }
    colonnesArchives = resolues;
    const nb = (donnees.id || []).length;
    archivesCache = [];
    for (let i = 0; i < nb; i++) {
      const ligne = { id: donnees.id[i] };
      for (const champ of Object.keys(resolues)) {
        ligne[champ] = resolues[champ] ? donnees[resolues[champ]][i] : null;
      }
      archivesCache.push(ligne);
    }
  } catch (e) {
    erreurArchives = `Table "${TABLE_ARCHIVES}" introuvable ou inaccessible — crée-la avant de pouvoir archiver.`;
    console.warn(erreurArchives, e);
  }
}

function formaterDate(epochSecondes) {
  if (typeof epochSecondes !== "number") return "—";
  return new Date(epochSecondes * 1000).toLocaleDateString("fr-FR");
}

// ============================================================
// État courant
// ============================================================
let enregistrement = null;   // ligne OP sélectionnée (brute)
let mappingsCourants = null; // vrais noms de colonnes OP choisis dans le panneau Grist
let premierChargementFait = false;

const $ = id => document.getElementById(id);

function afficherEtatVide() {
  $("fiche").classList.add("hidden");
  $("empty").classList.remove("hidden");
}

function construireChamps() {
  const conteneur = $("champs");
  conteneur.innerHTML = "";
  CHAMPS.forEach(champ => {
    const colonneReelle = mappingsCourants ? mappingsCourants[champ.cle] : null;
    const bloc = document.createElement("div");
    bloc.className = "champ";

    const label = document.createElement("label");
    label.textContent = champ.titre;
    bloc.appendChild(label);

    if (!colonneReelle) {
      const note = document.createElement("div");
      note.className = "non-mappe";
      note.textContent = "Colonne non mappée dans les options du widget.";
      bloc.appendChild(note);
      conteneur.appendChild(bloc);
      return;
    }

    const textarea = document.createElement("textarea");
    textarea.id = "champ-" + champ.cle;
    textarea.value = enregistrement[colonneReelle] || "";
    textarea.addEventListener("blur", () => sauvegarderChamp(champ.cle, colonneReelle, textarea));
    bloc.appendChild(textarea);

    const etat = document.createElement("div");
    etat.className = "etat";
    etat.id = "etat-" + champ.cle;
    bloc.appendChild(etat);

    conteneur.appendChild(bloc);
  });
}

async function sauvegarderChamp(cle, colonneReelle, textarea) {
  const etat = $("etat-" + cle);
  try {
    await grist.getTable("OP").update({ id: enregistrement.id, fields: { [colonneReelle]: textarea.value } });
    etat.textContent = "Enregistré";
  } catch (e) {
    console.error("Échec de l'enregistrement du champ", cle, e);
    etat.textContent = "Échec de l'enregistrement — réessaie";
    etat.style.color = "var(--warn)";
  }
  etat.classList.add("show");
  setTimeout(() => etat.classList.remove("show"), 1800);
}

function valeurChampActuel(cle) {
  const ta = $("champ-" + cle);
  return ta ? ta.value : "";
}

async function archiverBilan() {
  if (!colonnesArchives) {
    alert(erreurArchives || "Impossible d'archiver : table Archives_Commentaires introuvable.");
    return;
  }
  const bouton = $("btnArchiver");
  bouton.disabled = true;
  const annee = new Date().getFullYear();
  const fields = {
    [colonnesArchives.operation]: enregistrement.id,
    [colonnesArchives.annee]: annee,
    [colonnesArchives.date]: Math.floor(Date.now() / 1000)
  };
  CHAMPS.forEach(champ => {
    const colArchive = colonnesArchives[champ.cle];
    if (colArchive) fields[colArchive] = valeurChampActuel(champ.cle);
  });
  try {
    const resultat = await grist.getTable(TABLE_ARCHIVES).create({ fields });
    // Mise à jour optimiste du cache local : évite un nouvel appel fetchTable après chaque archivage.
    const nouvelleLigne = { id: resultat.id, operation: enregistrement.id, annee, date: fields[colonnesArchives.date] };
    CHAMPS.forEach(champ => { nouvelleLigne[champ.cle] = fields[colonnesArchives[champ.cle]]; });
    archivesCache.push(nouvelleLigne);
    afficherArchives();
  } catch (e) {
    console.error("Échec de l'archivage", e);
    alert("Échec de l'archivage — réessaie.");
  }
  bouton.disabled = false;
}

function afficherArchives() {
  const conteneur = $("listeArchives");
  conteneur.innerHTML = "";

  const avert = $("avertissementArchives");
  if (erreurArchives) {
    avert.textContent = erreurArchives;
    avert.classList.remove("hidden");
  } else {
    avert.classList.add("hidden");
  }

  if (!colonnesArchives || !enregistrement) return;

  const archivesOp = archivesCache
    .filter(a => a.operation === enregistrement.id)
    .sort((a, b) => (b.date || 0) - (a.date || 0));

  if (!archivesOp.length) {
    const vide = document.createElement("div");
    vide.className = "vide";
    vide.textContent = "Aucun bilan archivé pour cette opération.";
    conteneur.appendChild(vide);
    return;
  }

  archivesOp.forEach(archive => {
    const item = document.createElement("div");
    item.className = "archive-item";

    const head = document.createElement("div");
    head.className = "archive-head";
    const badge = document.createElement("span");
    badge.className = "annee-badge";
    badge.textContent = "Bilan " + (archive.annee ?? "—");
    const date = document.createElement("span");
    date.className = "date";
    date.textContent = formaterDate(archive.date);
    head.appendChild(badge);
    head.appendChild(date);
    head.addEventListener("click", () => item.classList.toggle("ouvert"));
    item.appendChild(head);

    const body = document.createElement("div");
    body.className = "archive-body";
    CHAMPS.forEach(champ => {
      const valeur = archive[champ.cle];
      if (!valeur) return;
      const ligne = document.createElement("div");
      ligne.className = "ligne";
      const lbl = document.createElement("span");
      lbl.className = "lbl";
      lbl.textContent = champ.titre;
      const texte = document.createElement("div");
      texte.textContent = valeur; // textContent : pas d'interprétation HTML, pas besoin d'échappement manuel
      ligne.appendChild(lbl);
      ligne.appendChild(texte);
      body.appendChild(ligne);
    });
    item.appendChild(body);

    conteneur.appendChild(item);
  });
}

function rafraichirFiche() {
  if (!enregistrement) { afficherEtatVide(); return; }
  $("empty").classList.add("hidden");
  $("fiche").classList.remove("hidden");

  const libelle = mappingsCourants && mappingsCourants.Libelle ? enregistrement[mappingsCourants.Libelle] : null;
  $("titre").textContent = libelle || "Opération";
  $("sousTitre").textContent = "Bilan " + new Date().getFullYear();
  $("btnArchiver").textContent = "Archiver le bilan " + new Date().getFullYear();

  construireChamps();
  afficherArchives();
}

$("btnArchiver").addEventListener("click", archiverBilan);

grist.onRecord((record, mappings) => {
  const mapped = grist.mapColumnNames(record);
  enregistrement = mapped || null;
  mappingsCourants = mappings;
  if (enregistrement && !premierChargementFait) {
    premierChargementFait = true;
    chargerArchives().then(rafraichirFiche);
  } else {
    rafraichirFiche();
  }
});

// Filet de sécurité : si aucune ligne n'est sélectionnée au chargement, on charge quand même
// le cache des archives une fois, pour qu'il soit prêt dès la première sélection.
window.addEventListener("load", () => setTimeout(() => {
  if (!premierChargementFait) { premierChargementFait = true; chargerArchives(); }
}, 1500));
</script>
</body>
</html>
